<div class="card text-center">
  <div class="card-body">
    <h5 class="card-title">Position name: {{ position.name }} </h5>
    <p class="card-text">Team size: {{ position.team_size }} </p>
    <p class="card-text">Minimum GPA: {{ position.min_gpa }} </p>
    <p class="card-text">Date: {{ position.start_date }} to {{ position.end_date}} </p>
  </div>
  <div class="card-footer text-muted">
    Posted by: <span class="useritem">{{ position.faculty }}</span>
  </div>
</div>
